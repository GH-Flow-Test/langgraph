name: AI Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:

  upload:
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - name: Push metadata to Scan0
        env:
          SCAN0_API_KEY: ${{ secrets.SCAN0_API_KEY }}
        run: |
          find bundle -name '*.json' -print0 | while IFS= read -r -d '' f; do
            echo "uploading $f"
            curl -sf -X POST "https://api.scan0.io/api/v1/scan-results" \
              -H "Authorization: Bearer ${SCAN0_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "X-Repo: ${{ github.repository }}" \
              -H "X-Commit: ${{ github.sha }}" \
              --data-binary @"$f"
          done
  scan:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Scanner
        run: |
          curl -fsSL https://scanner.scan0.io/latest/linux-amd64 -o scanner
          chmod +x scanner

      - name: Run AI Discovery Scan
        env:
          SCAN0_API_KEY: ${{ secrets.SCAN0_API_KEY }}
        run: |
          ./scanner scan \
            --repo "${{ github.repository }}" \
            --upload-url https://api.scan0.io/api/v1/scan-results \
            --api-key "$SCAN0_API_KEY"
